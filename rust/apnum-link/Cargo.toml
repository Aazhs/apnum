[package]
name = "apnum-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared link core for apnum: Noise XX sessions, framing and pairing helpers"

[lib]
name = "apnum_link"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
blake2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
thiserror = "2"
percent-encoding = "2"
uniffi = { version = "0.29", features = ["cli"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
